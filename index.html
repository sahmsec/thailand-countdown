<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thailand</title>
<meta name="description" content="A countdown to the Thailand field study.">
<meta name="theme-color" content="#0B1730">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌴</text></svg>">
<link rel="preload" as="image" href="assets/thailand.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Barlow+Semi+Condensed:wght@400;500;600&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#F0C784;
    --lotus:#F6A5B6;
    --jasmine:#FFF3E2;
    --ink:#0B1730;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--ink);
    color:var(--jasmine);
    font-family:"Barlow Semi Condensed",system-ui,sans-serif;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- the photograph ---------- */
  .photo{
    position:fixed; inset:0;
    background:url("assets/thailand.jpg") center 62% / cover no-repeat, var(--ink);
    filter:saturate(1.16) contrast(1.04) brightness(.6);
    transform:scale(1.02); /* hides filter edge bleed */
  }

  .scrim{
    position:fixed; inset:0;
    background:
      radial-gradient(52% 40% at 50% 40%, rgba(255,163,82,.16), rgba(255,163,82,0) 74%),
      linear-gradient(180deg,
        rgba(5,20,38,.74) 0%,
        rgba(6,26,46,.44) 26%,
        rgba(6,26,46,.36) 48%,
        rgba(5,18,34,.5) 72%,
        rgba(3,12,24,.88) 100%);
  }

  /* ---------- sky lanterns: the signature ---------- */
  .lanterns{position:fixed; inset:0; pointer-events:none; overflow:hidden}
  .lantern{
    position:absolute;
    bottom:34vh;
    left:var(--x);
    width:calc(11px * var(--s));
    height:calc(16px * var(--s));
    border-radius:46% 46% 40% 40% / 58% 58% 42% 42%;
    background:linear-gradient(to bottom,#FFE9BC,#FFB870 55%,#F4783E);
    box-shadow:0 0 calc(13px * var(--s)) calc(4px * var(--s)) rgba(255,171,92,.34);
    opacity:0;
    animation:rise var(--d) linear var(--delay) infinite;
  }
  @keyframes rise{
    0%   {transform:translate(0,0) rotate(-2deg); opacity:0}
    14%  {opacity:.85}
    66%  {opacity:.6}
    100% {transform:translate(var(--drift),-96vh) rotate(3deg); opacity:0}
  }

  /* ---------- content ---------- */
  main{
    position:relative;
    height:100%;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:clamp(13px,2.1vh,24px);
    padding:5vh 20px 8vh;
    text-align:center;
  }

  .eyebrow{
    margin:0;
    display:flex; flex-wrap:wrap;
    align-items:center; justify-content:center;
    gap:.35em clamp(10px,1.4vw,16px);
    font-size:clamp(.66rem,1.6vw,.8rem);
  }
  /* the official half */
  .stamp{
    padding:.5em 1.15em .44em;
    border:1.5px solid rgba(240,199,132,.6);
    border-radius:999px;
    background:rgba(240,199,132,.12);
    backdrop-filter:blur(9px);
    -webkit-backdrop-filter:blur(9px);
    font-weight:600;
    letter-spacing:.34em;
    text-indent:.34em;
    text-transform:uppercase;
    color:var(--gold);
    text-shadow:0 2px 12px rgba(6,14,30,.8);
  }
  /* ...and the half somebody scribbled on afterwards */
  .promise{
    font-family:"Caveat",ui-rounded,cursive;
    font-style:normal;
    font-weight:700;
    font-size:clamp(1.5rem,4.2vw,2.5rem);
    line-height:.9;
    color:var(--lotus);
    transform:rotate(-6deg);
    transform-origin:left center;
    text-shadow:0 3px 16px rgba(6,14,30,.9);
  }

  h1{
    margin:0;
    font-family:"Baloo 2",system-ui,sans-serif;
    font-weight:800;
    font-size:clamp(3.4rem,14vw,8rem);
    line-height:.92;
    letter-spacing:-.015em;
    background:linear-gradient(168deg,#FFF6E7 8%,var(--gold) 52%,var(--lotus) 96%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    filter:drop-shadow(0 6px 24px rgba(8,16,34,.75));
  }

  /* ---------- timer ---------- */
  .timer{
    display:flex; flex-wrap:wrap; justify-content:center;
    gap:clamp(8px,1.5vw,15px);
    margin-top:clamp(6px,1.4vh,16px);
  }

  .cell{
    min-width:clamp(72px,15.5vw,122px);
    padding:clamp(12px,2vh,20px) clamp(9px,1.6vw,15px) clamp(9px,1.4vh,14px);
    border-radius:20px;
    border:1px solid rgba(240,199,132,.32);
    background:linear-gradient(to bottom, rgba(255,246,233,.17), rgba(255,246,233,.05));
    backdrop-filter:blur(13px) saturate(1.2);
    -webkit-backdrop-filter:blur(13px) saturate(1.2);
    box-shadow:0 12px 34px rgba(4,12,26,.4), inset 0 1px 0 rgba(255,246,233,.34);
    opacity:0;
    animation:settle .8s cubic-bezier(.22,1,.36,1) forwards;
  }
  .cell:nth-child(1){animation-delay:.05s}
  .cell:nth-child(2){animation-delay:.15s}
  .cell:nth-child(3){animation-delay:.25s}
  .cell:nth-child(4){animation-delay:.35s}

  /* hours runs into the thousands, so it just needs more room — same type size */
  .cell--lead{min-width:clamp(114px,25vw,192px)}

  @keyframes settle{
    from{opacity:0; transform:translateY(14px) scale(.96)}
    to  {opacity:1; transform:none}
  }

  .num{
    display:block;
    font-family:"Baloo 2",system-ui,sans-serif;
    font-weight:700;
    font-size:clamp(2.2rem,7vw,3.7rem);
    line-height:1;
    font-variant-numeric:tabular-nums;
    color:var(--jasmine);
    text-shadow:0 2px 20px rgba(6,14,30,.6);
  }

  .lbl{
    display:block;
    margin-top:.5em;
    font-size:clamp(.58rem,1.4vw,.7rem);
    font-weight:600;
    letter-spacing:.26em;
    text-transform:uppercase;
    text-indent:.26em;
    color:rgba(240,199,132,.9);
  }

  .cell.tick .num{animation:pulse .5s ease-out}
  @keyframes pulse{
    0%{transform:scale(1)}
    28%{transform:scale(1.07)}
    100%{transform:scale(1)}
  }

  .foot{
    margin:clamp(4px,1vh,12px) 0 0;
    font-size:clamp(.64rem,1.5vw,.76rem);
    font-weight:500;
    letter-spacing:.34em;
    text-transform:uppercase;
    text-indent:.34em;
    color:rgba(246,214,158,.95);
    text-shadow:0 1px 3px rgba(6,14,30,.95), 0 2px 16px rgba(6,14,30,.9);
  }

  /* ---------- contributors ---------- */
  .crew{
    display:flex; flex-direction:column; align-items:center;
    gap:clamp(8px,1.4vh,13px);
    margin-top:clamp(12px,2.4vh,26px);
  }
  .crew-label{
    margin:0;
    font-size:clamp(.58rem,1.4vw,.7rem);
    font-weight:600;
    letter-spacing:.32em;
    text-transform:uppercase;
    text-indent:.32em;
    color:rgba(240,199,132,.72);
    text-shadow:0 2px 12px rgba(6,14,30,.85);
  }
  .crew ul{
    display:flex; flex-wrap:wrap; justify-content:center;
    gap:8px clamp(8px,1.4vw,14px);
    margin:0; padding:0; list-style:none;
  }
  .crew li{
    display:flex; align-items:center; gap:.5em;
    padding:.3em .9em .3em .3em;
    border-radius:999px;
    border:1px solid rgba(240,199,132,.28);
    background:rgba(255,246,233,.1);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    font-size:clamp(.72rem,1.6vw,.84rem);
    line-height:1.2;
  }
  .crew b{
    font-weight:600;
    letter-spacing:.13em;
    text-transform:uppercase;
    color:var(--gold);
  }
  .crew .role{color:rgba(255,243,226,.8); font-style:italic}

  /* face circles */
  .ava{
    position:relative;
    flex:0 0 auto;
    width:clamp(28px,6vw,34px); aspect-ratio:1;
    border-radius:50%;
    overflow:hidden;
    background:linear-gradient(160deg, rgba(240,199,132,.34), rgba(240,199,132,.12));
    box-shadow:0 0 0 1px rgba(240,199,132,.45), 0 3px 10px rgba(4,12,26,.45);
  }
  .ava img{
    position:absolute; inset:0; z-index:1;
    width:100%; height:100%;
    object-fit:cover;
    transform:scale(var(--z,1));
    transform-origin:50% var(--oy,30%);
  }
  .mono{
    position:absolute; inset:0;
    display:grid; place-items:center;
    font-family:"Baloo 2",system-ui,sans-serif;
    font-weight:700;
    font-size:.86em;
    color:rgba(255,243,226,.9);
  }

  /* ---------- credit ---------- */
  .credit{
    position:fixed;
    right:14px; bottom:10px;
    margin:0;
    font-size:.62rem;
    letter-spacing:.06em;
    color:rgba(255,243,226,.42);
    text-shadow:0 1px 8px rgba(4,10,24,.9);
  }
  .credit a{color:inherit; text-decoration:none; border-bottom:1px solid rgba(255,243,226,.22)}
  .credit a:hover,.credit a:focus-visible{color:rgba(255,243,226,.8)}
  :focus-visible{outline:2px solid var(--gold); outline-offset:3px; border-radius:4px}

  .arrived .timer,.arrived .foot{display:none}
  .arrived-note{display:none}
  .arrived .arrived-note{
    display:block;
    margin:0;
    font-family:"Baloo 2",system-ui,sans-serif;
    font-size:clamp(1.4rem,5vw,2.2rem);
    color:var(--gold);
  }

  .sr{
    position:absolute; width:1px; height:1px;
    margin:-1px; padding:0; overflow:hidden;
    clip:rect(0 0 0 0); white-space:nowrap; border:0;
  }

  @media (max-width:520px){
    .timer{max-width:330px}
    .cell{min-width:0; flex:1 1 44%}
    .cell--lead{flex-basis:100%}
    .credit{left:0; right:0; text-align:center}
  }

  @media (prefers-reduced-motion:reduce){
    .lantern{animation:none; opacity:.75}
    .cell{animation:none; opacity:1}
    .cell.tick .num{animation:none}
  }
</style>
</head>
<body>

<div class="photo" role="img" aria-label="A man on a sun lounger under a thatched umbrella, laptop open on his lap, facing a turquoise sea."></div>
<div class="scrim" aria-hidden="true"></div>
<div class="lanterns" id="lanterns" aria-hidden="true"></div>

<main>
  <p class="eyebrow"><span class="stamp">Study tour</span><em class="promise">(I promise 🤞)</em></p>
  <h1>Thailand</h1>
  <div class="timer" id="timer" role="timer">
    <div class="cell cell--lead" id="c-hours"><span class="num" id="hours">—</span><span class="lbl">Hours</span></div>
    <div class="cell" id="c-mins"><span class="num" id="mins">—</span><span class="lbl">Minutes</span></div>
    <div class="cell" id="c-secs"><span class="num" id="secs">—</span><span class="lbl">Seconds</span></div>
    <div class="cell" id="c-ms"><span class="num" id="ms">—</span><span class="lbl">Ms</span></div>
  </div>

  <p class="foot">until fieldwork begins</p>
  <p class="arrived-note">Fieldwork has commenced.</p>
  <p class="sr" id="sr" aria-live="polite"></p>

  <section class="crew">
    <p class="crew-label">Contributors</p>
    <ul>
      <li>
        <span class="ava"><span class="mono">S</span><img src="assets/sadhin.jpg" alt="" style="--z:1.5;--oy:33%" onerror="this.style.display='none'"></span>
        <b>Sadhin</b><span class="role">packed already. twice.</span>
      </li>
      <li>
        <span class="ava"><span class="mono">M</span><img src="assets/mubin.jpeg" alt="" style="--z:4.3;--oy:26%" onerror="this.style.display='none'"></span>
        <b>Mubin</b><span class="role">refreshes this page hourly</span>
      </li>
      <li>
        <span class="ava"><span class="mono">K</span><img src="assets/khaled.jpeg" alt="" style="--z:2.6;--oy:28%" onerror="this.style.display='none'"></span>
        <b>Khaled</b><span class="role">confirmed. unconfirmed. confirmed.</span>
      </li>
    </ul>
  </section>
</main>

<p class="credit">Photo by <a href="https://commons.wikimedia.org/wiki/File:Work_from_the_beach!.jpg" target="_blank" rel="noopener">AbhiSuryawanshi</a>, CC BY-SA 4.0 (resized)</p>

<script>
(function(){
  "use strict";

  var TARGET = new Date("2027-04-09T00:00:00+07:00").getTime();

  // --- sky lanterns ---
  var lanterns = document.getElementById("lanterns"), lfrag = document.createDocumentFragment();
  for (var j = 0; j < 9; j++){
    var l = document.createElement("span");
    l.className = "lantern";
    l.style.setProperty("--x", (4 + Math.random() * 92).toFixed(2) + "%");
    l.style.setProperty("--s", (0.45 + Math.random() * 0.6).toFixed(2));
    l.style.setProperty("--d", (34 + Math.random() * 34).toFixed(1) + "s");
    l.style.setProperty("--delay", "-" + (Math.random() * 60).toFixed(1) + "s");
    l.style.setProperty("--drift", (Math.random() * 90 - 30).toFixed(0) + "px");
    lfrag.appendChild(l);
  }
  lanterns.appendChild(lfrag);

  // --- countdown ---
  var el = {
    hours: document.getElementById("hours"),
    mins:  document.getElementById("mins"),
    secs:  document.getElementById("secs")
  };
  var cell = {
    hours: document.getElementById("c-hours"),
    mins:  document.getElementById("c-mins"),
    secs:  document.getElementById("c-secs")
  };
  var msNode = document.getElementById("ms");
  var srNode = document.getElementById("sr");
  var last = {}, lastSrMin = -1, lastMsPaint = 0;
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function pad(n){ return n < 10 ? "0" + n : String(n); }
  function pad3(n){ return ("00" + n).slice(-3); }

  function set(key, value){
    if (last[key] === value) return;
    last[key] = value;
    el[key].textContent = value;
    var c = cell[key];
    c.classList.remove("tick");
    void c.offsetWidth;
    c.classList.add("tick");
  }

  function render(now){
    var diff = TARGET - Date.now();

    if (diff <= 0){
      document.body.classList.add("arrived");
      srNode.textContent = "Fieldwork has commenced.";
      return;
    }

    var totalSec = Math.floor(diff / 1000);
    var h = Math.floor(totalSec / 3600);
    var m = Math.floor(totalSec / 60) % 60;
    var s = totalSec % 60;

    set("hours", h.toLocaleString("en-US"));
    set("mins", pad(m));
    set("secs", pad(s));

    // milliseconds repaint every frame, throttled when reduced motion is requested
    if (!reduce || now - lastMsPaint > 100){
      lastMsPaint = now;
      msNode.textContent = pad3(diff % 1000);
    }

    // announce once a minute rather than sixty times a second
    if (m !== lastSrMin){
      lastSrMin = m;
      srNode.textContent = h + " hours and " + m + " minutes until fieldwork begins.";
    }

    requestAnimationFrame(render);
  }

  requestAnimationFrame(render);
})();
</script>
</body>
</html>
